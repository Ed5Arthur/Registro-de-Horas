<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Pregação</title>
<meta name="description" content="Conte as horas de pregação, acompanhe a sua meta e envie o relatório pelo WhatsApp.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F5F9">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%231D5FBF'/%3E%3Ccircle cx='256' cy='256' r='150' fill='none' stroke='%23fff' stroke-opacity='.24' stroke-width='38'/%3E%3Cpath d='M256 106A150 150 0 1 1 106 256' fill='none' stroke='%23FFD166' stroke-width='38' stroke-linecap='round'/%3E%3Cpath d='M256 256V168M256 256l66 38' fill='none' stroke='%23fff' stroke-width='30' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pregação">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root {
  /* Minha Pregação: uma coluna de cartões, botões grandes e abas fixas embaixo.
     Letra Atkinson Hyperlegible (feita para leitura fácil); azul = ação, verde = enviar/meta, amarelo = progresso. */
  --bg: #F2F5F9;
  --surface: #FFFFFF;
  --line: #D9E1EB;
  --ink: #142033;
  --muted: #4A586B;
  --brand: #1D5FBF;
  --brand-ink: #1A56AD;
  --brand-soft: #E4EEFB;
  --hero: #1D5FBF;
  --good: #157A3E;
  --good-fill: #1E9E4A;
  --good-soft: #E3F4E8;
  --warn-soft: #FFF3D1;
  --danger: #B42318;
  --wa: #157A3E;
  --focus: #1A56AD;
  --bar: #2a78d6;
  --bar-sel: #184f95;
  --grid: #E4E9F0;
  --track: #D5E3F6;
  --prog: #FFD166;
  --prog-done: #8BE3A6;
  --chat: #EAE3DA;
  --bubble: #D9FDD3;
  --bubble-ink: #111B21;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Arial, sans-serif;
  --scale: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131D; --surface: #161E2B; --line: #2A3647; --ink: #EDF2F8; --muted: #A7B3C4;
    --brand: #2F6FD0; --brand-ink: #8DB6F2; --brand-soft: #1A2A44; --hero: #1E4F9C;
    --good: #6FD69A; --good-fill: #2FB463; --good-soft: #15301F; --warn-soft: #3A2F10; --danger: #F2837A;
    --wa: #1E7F46; --focus: #8DB6F2; --bar: #3987e5; --bar-sel: #9ec5f4; --grid: #253043; --track: #22324A;
    --chat: #0B141A; --bubble: #005C4B; --bubble-ink: #E9EDEF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131D; --surface: #161E2B; --line: #2A3647; --ink: #EDF2F8; --muted: #A7B3C4;
  --brand: #2F6FD0; --brand-ink: #8DB6F2; --brand-soft: #1A2A44; --hero: #1E4F9C;
  --good: #6FD69A; --good-fill: #2FB463; --good-soft: #15301F; --warn-soft: #3A2F10; --danger: #F2837A;
  --wa: #1E7F46; --focus: #8DB6F2; --bar: #3987e5; --bar-sel: #9ec5f4; --grid: #253043; --track: #22324A;
  --chat: #0B141A; --bubble: #005C4B; --bubble-ink: #E9EDEF;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: calc(18px * var(--scale)); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, textarea, output { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 1rem; }
p { margin: 0; }
b, strong { font-weight: 700; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(7.2rem + env(safe-area-inset-bottom)); }
#view { display: grid; gap: 14px; }
.ic { width: 1.35em; height: 1.35em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 1.05em; height: 1.05em; }
.ic.huge { width: 4.5rem; height: 4.5rem; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: .9rem; }
.opt { font-weight: 400; color: var(--muted); font-size: .88rem; }
.err { color: var(--danger); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card h2 .ic { color: var(--brand-ink); }
.k { font-size: .82rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

/* Topo */
.hello { display: grid; gap: 2px; }
.brandmark { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--brand-ink); font-size: .95rem; }
.brandmark .ic { width: 1.6em; height: 1.6em; }
.hello h1 { font-size: 1.75rem; margin-top: 8px; }
.page-head { display: grid; gap: 4px; }

/* Cartão principal */
.hero { background: var(--hero); color: #fff; border-radius: 22px; padding: 20px; display: grid; gap: 12px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hero .k { color: rgba(255,255,255,.92); }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 2.5rem; padding: 6px 12px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.6); background: rgba(255,255,255,.12); color: #fff; font-weight: 700; font-size: .85rem; text-align: left; }
.big { font-size: 2.7rem; font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; }
.of { font-size: 1.05rem; opacity: .95; margin-top: 4px; }
.meter { height: 18px; border-radius: 999px; background: var(--track); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
.meter.done > i { background: var(--good-fill); }
.hero .meter { background: rgba(255,255,255,.22); }
.hero .meter > i { background: var(--prog); }
.hero .meter.done > i { background: var(--prog-done); }
.hero-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; font-size: .95rem; }
.hero-row span { display: inline-flex; align-items: center; gap: 6px; }
.pace { font-size: 1rem; line-height: 1.45; }
.hero .link { color: #fff; }
.on-hero { color: rgba(255,255,255,.9); }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 3.5rem; padding: 10px 18px; border-radius: 16px; border: 2px solid transparent; font-weight: 700; font-size: 1.05rem; line-height: 1.2; text-decoration: none; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--brand); color: #fff; }
.btn-secondary { background: var(--surface); color: var(--brand-ink); border-color: currentColor; }
.btn-wa { background: var(--wa); color: #fff; min-height: 3.9rem; font-size: 1.12rem; }
.btn-danger { background: transparent; color: var(--danger); border-color: currentColor; }
.btn-ghost { background: transparent; color: var(--brand-ink); min-height: 3rem; }
.btn.small { min-height: 2.9rem; font-size: .96rem; padding: 8px 14px; }
.big-cta { min-height: 4.2rem; font-size: 1.2rem; border-radius: 18px; }
.danger-text { color: var(--danger); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link { background: none; border: 0; padding: 0; color: var(--brand-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.icon-btn { width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--ink); display: inline-grid; place-items: center; flex: none; padding: 0; }
.icon-btn:disabled { opacity: .3; cursor: default; }

/* Escolhas */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.card .seg { background: var(--bg); }
.seg button { min-height: 3rem; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-weight: 700; padding: 6px 6px; font-size: .98rem; line-height: 1.15; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.opts { display: grid; gap: 10px; }
.opt-btn { position: relative; display: grid; gap: 3px; text-align: left; padding: 14px 3.4rem 14px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); min-height: 3.5rem; align-content: center; }
.opt-btn b { font-size: 1.05rem; }
.opt-btn span { color: var(--muted); font-size: .92rem; line-height: 1.35; }
.opt-btn span:empty { display: none; }
.opt-btn .radio { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; }
.opt-btn[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.opt-btn[aria-pressed="true"] .radio { border-color: var(--brand); }
.opt-btn[aria-pressed="true"] .radio::after { content: ""; width: .8rem; height: .8rem; border-radius: 50%; background: var(--brand); }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.2rem, 1fr)); gap: 10px; }
.chip { display: flex; align-items: center; gap: 10px; min-height: 3.6rem; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); text-align: left; font-weight: 700; font-size: .98rem; line-height: 1.2; }
.chip > .ic { color: var(--brand-ink); }
.chip > span { min-width: 0; }
.chip small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; margin-top: 2px; }
.chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.chip[aria-pressed="true"] > .ic { color: var(--brand); width: 1.55em; height: 1.55em; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { display: inline-flex; align-items: center; gap: 6px; min-height: 2.8rem; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; }
.qchip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 3.2rem; padding: 8px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; text-align: left; }
.check .box { width: 1.5rem; height: 1.5rem; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; flex: none; }
.check .box .ic { width: .95rem; height: .95rem; stroke: #fff; stroke-width: 3; }
.check[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.check[aria-pressed="true"] .box { background: var(--brand); border-color: var(--brand); }

/* Formulários */
.field { display: grid; gap: 10px; }
.lbl { font-weight: 700; font-size: 1rem; }
.q { font-size: 1.15rem; display: block; }
.txt, textarea, input[type="date"] { width: 100%; min-height: 3.4rem; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font-size: 1.05rem; }
textarea { resize: vertical; min-height: 5.4rem; line-height: 1.4; }
.txt:focus, textarea:focus, input[type="date"]:focus { border-color: var(--brand-ink); outline: none; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .icon-btn { border-color: var(--brand-ink); color: var(--brand-ink); width: 3.3rem; height: 3.3rem; }
.stepper input { width: 4rem; height: 3.3rem; text-align: center; font-size: 1.6rem; font-weight: 700; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0; font-variant-numeric: tabular-nums; }
.stepper input:focus { border-color: var(--brand-ink); outline: none; }
.stepper .goal-input { width: 4.6rem; border-color: var(--brand-ink); background: var(--brand-soft); }
.stepper .unit { font-weight: 700; color: var(--muted); }
.stepper .val { min-width: 3.4rem; text-align: center; font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper .val small { font-size: .9rem; color: var(--muted); margin-left: 2px; }
.stepper.sm .icon-btn { width: 2.9rem; height: 2.9rem; }
.stepper.sm .val { min-width: 2.4rem; font-size: 1.35rem; }
.time-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.when { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.when .ic { color: var(--brand-ink); }
.cnts { display: grid; }
.cnt-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.cnt-row:first-child { border-top: 0; }
.cnt-l { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.cnt-l .ic { color: var(--brand-ink); }
.addrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.addrow .btn { width: auto; }
.hours-big { font-size: 2.3rem; font-weight: 700; line-height: 1; display: flex; align-items: baseline; gap: 8px; }
.hours-big small { font-size: 1rem; color: var(--muted); }

/* Avisos */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--brand-soft); color: var(--ink); }
.banner > .ic { margin-top: 1px; color: var(--brand-ink); }
.banner > div { display: grid; gap: 8px; flex: 1; min-width: 0; }
.banner.warn { background: var(--warn-soft); }
.banner.warn > .ic { color: var(--ink); }
.banner.ok { background: var(--good-soft); }
.banner.ok > .ic { color: var(--good); }
.banner.small { padding: 10px 12px; font-size: .95rem; }
.banner.demo { align-items: center; }
.okline { color: var(--good); font-weight: 700; display: flex; align-items: center; gap: 6px; }

/* Quadradinhos e listas */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 2px; color: var(--ink); }
.tile-k { font-size: .85rem; font-weight: 700; color: var(--muted); }
.tile-v { font-size: 1.45rem; font-weight: 700; line-height: 1.15; }
.tile-s { font-size: .85rem; color: var(--muted); }
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.4rem, 1fr)); gap: 10px; }
.count { background: var(--bg); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; justify-items: start; }
.count .ic { color: var(--brand-ink); }
.count b { font-size: 1.5rem; line-height: 1.1; }
.count span { font-size: .85rem; color: var(--muted); line-height: 1.2; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.6rem, 1fr)); gap: 10px; }
.kpis > div { background: var(--bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.kpis span { font-size: .8rem; color: var(--muted); line-height: 1.2; }
.kpis b { font-size: 1.15rem; }
.sum-big { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
.sum-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sum-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.pill2 { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--bg); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: .85rem; text-align: right; color: var(--ink); line-height: 1.25; }
.entries { display: grid; }
.entry { display: grid; grid-template-columns: 5.4rem 1fr auto; align-items: center; gap: 12px; text-align: left; padding: 12px 2px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink); width: 100%; }
.entry:first-child { border-top: 0; }
.entry > .ic { color: var(--muted); }
.entry-when { display: grid; font-size: .85rem; color: var(--muted); }
.entry-when b { color: var(--ink); font-size: 1.1rem; }
.entry-what { display: grid; gap: 2px; min-width: 0; }
.entry-what > span { font-weight: 700; }
.entry-what small { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; display: block; }
.entry-what small .ic { vertical-align: -0.18em; margin-right: 4px; color: var(--good); }
.day-group { display: grid; gap: 2px; }
.day-h { font-size: .92rem; color: var(--muted); padding-top: 8px; }
.brk { display: grid; gap: 12px; }
.brk-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 10px; row-gap: 6px; }
.brk-row .ic { color: var(--brand-ink); }
.brk-l { font-weight: 700; }
.brk-v { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.brk-bar { grid-column: 2 / 4; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.brk-bar i { display: block; height: 100%; border-radius: 999px; background: var(--bar); }
.suggs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sugg { display: grid; gap: 2px; justify-items: center; text-align: center; padding: 12px 6px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.sugg b { font-size: 1.5rem; }
.sugg span { font-size: .85rem; font-weight: 700; color: var(--muted); }
.sugg small { font-size: .75rem; color: var(--danger); line-height: 1.2; }
.sugg.on { border-color: var(--brand); background: var(--brand-soft); }
.svc { display: grid; gap: 2px; }
.svc b { font-size: 1.15rem; }
.svc span { color: var(--muted); }

/* Gráficos */
.pnav { display: flex; align-items: center; gap: 10px; }
.pnav-t { flex: 1; text-align: center; display: grid; gap: 2px; }
.pnav-t b { font-size: 1.15rem; line-height: 1.2; }
.pnav-t span { color: var(--muted); font-size: .88rem; }
.readout { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.readout b { font-size: 1.45rem; }
.readout span { color: var(--muted); }
.chart { min-height: 120px; }
.chart svg { display: block; overflow: visible; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--bar); }
.chart .bar.sel { fill: var(--bar-sel); }
.chart .goal { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; }
.chart .goaltick { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; opacity: .55; }
.chart text { fill: var(--muted); font-family: var(--font); }
.chart .ytick, .chart .xsub { font-size: .68rem; }
.chart .xtick { font-size: .74rem; font-weight: 700; }
.chart .xtick.on { fill: var(--ink); }
.chart .xtick.dim { opacity: .5; }
.chart .goallbl { font-size: .72rem; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.chart .hit { fill: transparent; cursor: pointer; outline: none; }
.chart .hit:focus-visible { stroke: var(--focus); stroke-width: 2; }
.hbars { display: grid; gap: 2px; }
.hbar { display: grid; grid-template-columns: 2.7rem minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 2.75rem; padding: 4px 4px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); text-align: left; width: 100%; }
.hbar:disabled { opacity: .45; cursor: default; }
.hbar.cur { background: var(--bg); }
.hb-l { font-weight: 700; font-size: .95rem; }
.hbar.cur .hb-l { color: var(--brand-ink); }
.hb-track { position: relative; height: 14px; border-radius: 0 4px 4px 0; background: var(--grid); }
.hb-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--bar); }
.hb-goal { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); opacity: .7; }
.hb-v { min-width: 4.6rem; text-align: right; font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hb-v .ic { color: var(--good); margin-left: 4px; vertical-align: -0.18em; }
.lrows { display: grid; gap: 10px; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) 5.2rem auto; align-items: center; gap: 10px; }
.lrow small { display: block; color: var(--muted); font-size: .8rem; }
.lrow input { min-height: 3rem; text-align: center; font-weight: 700; padding: 8px; }
details.nums summary { cursor: pointer; font-weight: 700; color: var(--brand-ink); min-height: 2.8rem; display: flex; align-items: center; gap: 8px; list-style: none; }
details.nums summary::-webkit-details-marker { display: none; }
table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.t td { padding: 8px 2px; border-top: 1px solid var(--line); }
table.t td:last-child { text-align: right; font-weight: 700; white-space: nowrap; padding-left: 10px; }

/* Prévia do WhatsApp */
.chat { background: var(--chat); border-radius: 16px; padding: 14px 12px; display: flex; justify-content: flex-end; }
.bubble { background: var(--bubble); color: var(--bubble-ink); border-radius: 14px 4px 14px 14px; padding: 10px 12px 12px; max-width: 94%; font-size: .98rem; line-height: 1.45; box-shadow: 0 1px 1px rgba(0,0,0,.12); overflow-wrap: anywhere; }

/* Abas */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabbar button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 4.1rem; padding: 8px 2px 10px; border: 0; background: none; color: var(--muted); font-weight: 700; font-size: .8rem; }
.tabbar button .ic { width: 1.65rem; height: 1.65rem; }
.tabbar button[aria-current="page"] { color: var(--brand-ink); }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 4px; border-radius: 0 0 4px 4px; background: var(--brand); }

/* Telas por cima */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-head h1 { font-size: 1.3rem; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-inner { max-width: 560px; margin: 0 auto; padding: 18px 16px 28px; display: grid; gap: 24px; }
.sheet-foot { background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.sheet-foot > div { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; }
body.has-sheet { overflow: hidden; }
.dlg-back { position: fixed; inset: 0; z-index: 60; background: rgba(10,16,28,.55); display: grid; place-items: center; padding: 20px; }
.dlg { background: var(--surface); color: var(--ink); border-radius: 22px; max-width: 440px; width: 100%; padding: 22px; display: grid; gap: 14px; max-height: calc(100dvh - 40px); overflow-y: auto; }
.dlg h2 { font-size: 1.3rem; }
.dlg-actions { display: grid; gap: 10px; margin-top: 4px; }
.dlg textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; min-height: 8rem; }
.celebrate { display: grid; place-items: center; }
.celebrate .ic { fill: var(--prog); stroke: #B7860B; stroke-width: 1.2; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(5.4rem + env(safe-area-inset-bottom)); z-index: 70; width: max-content; max-width: min(520px, calc(100% - 32px)); background: #142033; color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; font-weight: 700; box-shadow: 0 8px 28px rgba(0,0,0,.25); }
.toast button { background: none; border: 0; color: #FFD166; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 4px; white-space: nowrap; }
body.has-sheet .toast { bottom: calc(6.6rem + env(safe-area-inset-bottom)); }

/* Boas-vindas */
.welcome { display: grid; gap: 16px; padding-top: 8px; }
.welcome h1 { font-size: 1.9rem; }
.lead { font-size: 1.1rem; }
.dots { display: flex; gap: 6px; }
.dots i { width: 32px; height: 6px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--brand); }
.alt { display: grid; gap: 2px; }
.alt .btn { font-size: .95rem; }
ol.steps { margin: 0; padding-left: 1.3rem; display: grid; gap: 8px; }
.about { color: var(--muted); font-size: .85rem; text-align: center; padding: 6px 12px 0; }
.timer { border: 2px solid var(--brand); }
.card.setup { border: 2px solid var(--brand); }
.card.setup .k { color: var(--brand-ink); }
.timer-top { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
.is-running .dot { background: #E5484D; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.timer-clock { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>

];

const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');

const roundUp5 = m => Math.ceil(m / 5) * 5;

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };

const ymOf = s => s.slice(0, 7);
function ymAdd(ym, n) { let y = +ym.slice(0, 4), m = +ym.slice(5, 7) + n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; }
function daysInMonth(ym) { return new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate(); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function weekStart(s) { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }
function monthRange(ym) { return [`${ym}-01`, `${ym}-${pad(daysInMonth(ym))}`]; }
function serviceYearOf(ym) { const y = +ym.slice(0, 4); return +ym.slice(5, 7) >= 9 ? y + 1 : y; }
function serviceYearMonths(ym) { const sy = serviceYearOf(ym); return Array.from({ length: 12 }, (_, i) => ymAdd(`${sy - 1}-09`, i)); }
function yearMonthsFor(ym) {
  if (S.settings.yearMode === 'civil') { const y = ym.slice(0, 4); return Array.from({ length: 12 }, (_, i) => `${y}-${pad(i + 1)}`); }
  return serviceYearMonths(ym);
}
function fmtHM(min) {
  min = Math.round(min || 0);
  if (min <= 0) return '0h';
  const h = Math.floor(min / 60), m = min % 60;
  return h && m ? `${h}h ${m}min` : h ? `${h}h` : `${m}min`;
}
function fmtClock(ms) { const t = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t % 3600 / 60))}:${pad(t % 60)}`; }
function monthLabel(ym, withYear) { const m = MONTHS[+ym.slice(5, 7) - 1]; return withYear === false ? m : `${m} de ${ym.slice(0, 4)}`; }

  const dim = daysInMonth(cur), daysLeft = dim - parseYmd(t).getDate() + 1;

    const rem = goalMin - total;
    pace = `Faltam <b>${fmtHM(rem)}</b>. Dá mais ou menos <b>${fmtHM(roundUp5(rem / daysLeft))} por dia</b> até o dia ${dim}.`;
    if (daysLeft >= 8) pace += ` Ou <b>${fmtHM(roundUp5(rem / daysLeft * 7))} por semana</b>.`;
  }

/* ----- Gráfico de barras (SVG) ----- */
function niceScale(maxH) {
  const steps = [0.5, 1, 2, 3, 5, 10, 20, 25, 50, 100, 200];
  for (const s of steps) { const n = Math.ceil(maxH / s); if (n <= 5) return { max: Math.max(s, n * s), step: s }; }
  return { max: Math.ceil(maxH / 500) * 500, step: 500 };
}
const fmtTick = h => (h === 0 ? '0' : `${String(h).replace('.', ',')}h`);
function drawChart(el, spec) { const W = Math.max(240, Math.floor(el.clientWidth || 320)); el.innerHTML = barChartSvg(spec, W); }
function barChartSvg(spec, W) {
  const vals = spec.values, n = vals.length, fs = rootPx() * 0.72, sub = spec.sub || [];
  const padL = Math.round(fs * 2.7), padR = 6, padT = Math.round(fs * 1.7), axisH = Math.round(fs * (sub.length ? 3.1 : 2));
  const plotH = Math.round(clamp(W * 0.52, 150, 230)), Hh = padT + plotH + axisH, plotW = W - padL - padR;
  const extra = (spec.goals || []).concat(spec.goalLine ? [spec.goalLine] : []);
  const sc = niceScale(Math.max(1, ...vals, ...extra) / 60);
  const y = v => padT + plotH - (v / 60) / sc.max * plotH, base = padT + plotH;
  const slot = plotW / n, bw = Math.max(3, Math.min(24, slot - 2, slot * 0.66));
  let g = '';
  for (let tv = 0; tv <= sc.max + 1e-9; tv += sc.step) {
    const yy = Math.round(y(tv * 60)) + 0.5;
    if (tv > 0) g += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" class="grid"/>`;
    g += `<text x="${padL - 6}" y="${(yy + fs * 0.34).toFixed(1)}" text-anchor="end" class="ytick">${fmtTick(Math.round(tv * 10) / 10)}</text>`;
  }
  for (let i = 0; i < n; i++) {
    const v = vals[i], cx = padL + slot * i + slot / 2, x = cx - bw / 2;
    if (v > 0) {
      const top = Math.min(base - 2, y(v)), r = Math.min(4, bw / 2, base - top);
      g += `<path d="M${x.toFixed(1)},${base}V${(top + r).toFixed(1)}Q${x.toFixed(1)},${top.toFixed(1)} ${(x + r).toFixed(1)},${top.toFixed(1)}H${(x + bw - r).toFixed(1)}Q${(x + bw).toFixed(1)},${top.toFixed(1)} ${(x + bw).toFixed(1)},${(top + r).toFixed(1)}V${base}Z" class="bar${spec.sel === i ? ' sel' : ''}"/>`;
    }
    if (spec.goals && spec.goals[i]) { const gy = y(spec.goals[i]).toFixed(1); g += `<line x1="${(cx - slot * 0.42).toFixed(1)}" x2="${(cx + slot * 0.42).toFixed(1)}" y1="${gy}" y2="${gy}" class="goaltick"/>`; }
    if (!spec.showLabel || spec.showLabel(i) || spec.sel === i) {
      const cls = `xtick${spec.muted && spec.muted[i] ? ' dim' : ''}${spec.sel === i ? ' on' : ''}`;
      g += `<text x="${cx.toFixed(1)}" y="${(base + fs * 1.4).toFixed(1)}" text-anchor="middle" class="${cls}">${spec.labels[i]}</text>`;
      if (sub[i]) g += `<text x="${cx.toFixed(1)}" y="${(base + fs * 2.6).toFixed(1)}" text-anchor="middle" class="xsub">${sub[i]}</text>`;
    }
  }
  if (spec.goalLine) {
    const gy = Math.round(y(spec.goalLine)) + 0.5;
    g += `<line x1="${padL}" x2="${W - padR}" y1="${gy}" y2="${gy}" class="goal"/><text x="${W - padR - 2}" y="${gy - 6}" text-anchor="end" class="goallbl">Meta ${spec.goalLine / 60}h</text>`;
  }
  g += `<line x1="${padL}" x2="${W - padR}" y1="${base + 0.5}" y2="${base + 0.5}" class="axis"/>`;
  for (let i = 0; i < n; i++) g += `<rect x="${(padL + slot * i).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${plotH + axisH}" class="hit" data-act="bar" data-i="${i}" tabindex="0" role="button" aria-label="${esc(`${spec.read(i)}: ${fmtHM(vals[i])}`)}"/>`;
  return `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(spec.title)}">${g}</svg>`;
}

function saveEntry() {

async function doBackup() {
  const data = JSON.stringify({ app: 'minha-pregacao', v: 1, exportedAt: new Date().toISOString(), data: S });
  const name = `minha-pregacao-copia-${todayStr()}.json`;
  const done = () => { S.lastBackup = Date.now(); save(); if (route === 'ajustes') render(); };
  if (inFrame) { showBackupText(data, done); return; }
  try {
    const file = new File([data], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Cópia de segurança: Minha Pregação' });
      done(); toast('Cópia enviada. Guarde bem esse arquivo.'); return;
    }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    done(); toast('Cópia salva na pasta Downloads do celular.');
  } catch (err) { showBackupText(data, done); }
}

function buildDemo() {
  const st = freshState();
  st.profile = { name: 'Maria Souza', g: 'f', createdAt: Date.now() };
  st.plan = [{ from: '0000-01', role: 'regular', goal: 50 }];
  st.setup = { done: true, at: Date.now(), start: null };
  st.settings.font = S.settings.font; st.settings.theme = S.settings.theme;
  let seed = 20261118;
  const rnd = () => { seed = (seed * 48271) % 2147483647; return seed / 2147483647; };
  const t = todayStr(), P = [0.55, 0.35, 0.75, 0.45, 0.7, 0.3, 0.95], MIN = [60, 90, 120, 150, 180, 180, 210, 240, 270];
  const people = ['Ana', 'Rosa', 'Cláudia', 'Lúcia'];
  for (let d = addDays(t, -235); d <= t; d = addDays(d, 1)) {
    const wd = parseYmd(d).getDay();
    if (rnd() > P[wd]) continue;
    const r = rnd();
    const acts = [r < 0.5 || wd === 6 ? 'campo' : r < 0.7 ? 'carrinho' : r < 0.85 ? 'informal' : 'cartas'];
    if (rnd() < 0.35) acts.push('revisita');
    const e = { id: uid(), date: d, min: MIN[Math.floor(rnd() * MIN.length)], acts, pubs: Math.floor(rnd() * 3), cards: Math.floor(rnd() * 3), videos: Math.floor(rnd() * 2), students: [], note: '', credit: false, creditType: '', createdAt: Date.now(), updatedAt: 0 };
    if (rnd() < 0.32) { e.acts.push('estudo'); e.students = [people[Math.floor(rnd() * people.length)]]; }
    st.entries.push(e);
  }
  const prev = ymAdd(ymOf(t), -1);
  st.entries.push({ id: uid(), date: `${prev}-12`, min: 240, acts: [], pubs: 0, cards: 0, videos: 0, students: [], note: 'Ajudei na reforma do Salão do Reino', credit: true, creditType: 'construcao', createdAt: Date.now(), updatedAt: 0 });
  for (let i = 2; i <= 9; i++) st.months[ymAdd(ymOf(t), -i)] = { sentAt: Date.now() - i * 2.6e9 };
  return st;
}

  },
  'timer-discard': () => dialog({ title: 'Descartar o cronômetro?', html: `<p>O tempo de <b>${fmtHM(Math.round(timerElapsed() / 60000))}</b> não vai ser registrado.</p>`, actions: [{ label: 'Sim, descartar', kind: 'btn-danger', fn: () => { S.timer = freshState().timer; save(); render(); } }, { label: 'Não' }] }),
  'h-mode': el => { const P = period(H.mode, H.anchor || todayStr()), t = todayStr(); if (t >= P.from && t <= P.to) H.anchor = t; H.mode = el.dataset.m; H.sel = null; render(); },
  'h-prev': () => { H.anchor = shiftAnchor(H.mode, H.anchor, -1); H.sel = null; render(); },
  'h-next': () => { if (!period(H.mode, H.anchor).canNext) return; H.anchor = shiftAnchor(H.mode, H.anchor, 1); H.sel = null; render(); },
  'h-today': () => { H.anchor = todayStr(); H.sel = null; render(); },
  bar: el => { H.sel = +el.dataset.i; render(); },
  'goto-month': el => { H.mode = 'mes'; H.anchor = `${el.dataset.ym}-01`; H.sel = null; if (route === 'historico') { render(); window.scrollTo(0, 0); } else tabTo('historico'); },
  'goto-year': () => { H.mode = 'ano'; H.anchor = todayStr(); H.sel = null; if (route === 'historico') { render(); window.scrollTo(0, 0); } else tabTo('historico'); },
  suggest: el => { const g = +el.dataset.goal, ym = ymOf(todayStr()), p = planFor(ym), snap = snapshot(); setPlan(ym, p.role, g, false); save(); render(); toast(`Nova meta: ${g}h por mês.`, { label: 'Desfazer', fn: () => restoreSnap(snap) }); },
  'r-goto': el => { R.ym = el.dataset.ym; tabTo('relatorio'); },
  'r-prev': () => { R.ym = ymAdd(R.ym, -1); render(); },
  'r-next': () => { const n = ymAdd(R.ym, 1); if (n <= ymOf(todayStr())) { R.ym = n; render(); } },
  'r-part': el => { monthMeta(R.ym).participated = el.dataset.v === '1'; save(); render(); },
  'r-st': el => { const m = monthMeta(R.ym); m.studies = clamp(reportStudies(R.ym) + +el.dataset.d, 0, 99); save(); render(); },
  'r-st-auto': () => { delete monthMeta(R.ym).studies; save(); render(); },
  'r-carry': () => { monthMeta(R.ym).carry = true; save(); render(); },
  'r-uncarry': () => { monthMeta(R.ym).carry = false; save(); render(); },
  'r-opt': el => { const k = el.dataset.k; if (k === 'hours') { const cur = S.report.hours != null ? S.report.hours : ROLES[planFor(R.ym).role].hours; S.report.hours = !cur; } else S.report[k] = !S.report[k]; save(); render(); },
  'r-copy': async () => { const ok = await copyText(buildReport(R.ym)); toast(ok ? 'Texto copiado. Agora é só colar no WhatsApp.' : 'Não deu para copiar. Segure o dedo no texto da prévia.'); },
  'r-share': async () => { try { await navigator.share({ text: buildReport(R.ym) }); markSent(R.ym); } catch (e) { /* a pessoa cancelou */ } },
  'r-wa': () => { const ym = R.ym; setTimeout(() => markSent(ym), 400); },
  'r-unsent': () => { delete monthMeta(R.ym).sentAt; save(); render(); },
  'set-g': el => { S.profile.g = el.dataset.g; save(); render(); },
  'year-mode': el => { S.settings.yearMode = el.dataset.v; save(); render(); },
  font: el => { S.settings.font = +el.dataset.v; save(); render(); },
  theme: el => { S.settings.theme = el.dataset.v; save(); render(); },
  backup: () => doBackup(),
  backfill: () => backfillDialog(),
  'su-reg': el => { if (el.dataset.v === 'new') { SU.step = 'month'; SU.start = null; } else SU.step = 'hours'; render(); },
  'su-month': el => { SU.start = el.dataset.ym; render(); },
  'su-month-ok': () => { if (!SU.start) return; setStartMonth(SU.start); SU.step = 'hours'; save(); render(); },
  'su-back': () => { SU.step = 'ask'; SU.start = null; render(); },
  'su-hours': el => {
    const start = S.setup.start || SU.start || null;
    finishSetup({ start });
    render();
    if (el.dataset.v === 'yes') backfillDialog(); else toast('Tudo certo! É só ir anotando a pregação.');
  },
  'setup-redo': () => { S.setup = { done: false, at: 0, start: null }; SU.step = 'ask'; SU.start = null; save(); tabTo('inicio'); window.scrollTo(0, 0); },
  'pub-report': el => { S.settings.pubReport = el.dataset.v === '1'; save(); render(); toast(S.settings.pubReport ? 'A aba Relatório apareceu lá embaixo.' : 'A aba Relatório foi escondida.'); },
  'svc-ym': el => { const c = sheetCtx, cur = ymOf(todayStr()), n = ymAdd(c.ym, +el.dataset.d); if (n >= ymAdd(cur, -36) && n <= ymAdd(cur, 12)) { c.ym = n; renderSheet(); } },
  restore: () => {
    if (inFrame) dialog({ title: 'Restaurar uma cópia', html: '<p>Escolha o arquivo da cópia ou cole o texto dela.</p>', actions: [{ label: 'Escolher arquivo', kind: 'btn-primary', fn: () => $('#file-restore').click() }, { label: 'Colar o texto', fn: pasteDialog }, { label: 'Cancelar', kind: 'btn-ghost' }] });
    else $('#file-restore').click();
  },
  install: async () => { if (!deferredPrompt) return; const p = deferredPrompt; deferredPrompt = null; try { p.prompt(); await p.userChoice; } catch (e) { /* ignorado */ } render(); },
  'install-dismiss': () => { S.settings.installDismissed = true; save(); render(); },
  wipe: () => dialog({ title: 'Apagar todos os dados?', html: '<p>Isso apaga o seu nome, as metas e <b>todos os registros</b> deste celular. Se quiser guardar, faça uma cópia de segurança antes.</p>', actions: [
    { label: 'Fazer uma cópia antes', kind: 'btn-primary', fn: () => doBackup() },
    { label: 'Apagar tudo', kind: 'btn-danger', fn: () => dialog({ title: 'Tem certeza?', html: '<p>Depois de apagar, não tem como desfazer.</p>', actions: [
      { label: 'Sim, apagar tudo', kind: 'btn-danger', fn: () => { S = freshState(); try { localStorage.removeItem(KEY); } catch (e) { /* nada */ } Object.assign(OB, { step: 1, name: '', g: '', role: '', goal: 10, err: '' }); route = 'inicio'; hist('replaceState', { r: 'inicio' }, 'inicio'); render(); toast('Todos os dados foram apagados.'); } },
      { label: 'Não, voltar' }] }) },
    { label: 'Cancelar', kind: 'btn-ghost' }] }),
  'open-service': el => { const ym = el.dataset.ym || ymOf(todayStr()), p = planFor(ym); openSheet('servico', { ym, role: p.role, goal: p.goal, only: false }); },
  'svc-role': el => { const c = sheetCtx; c.role = el.dataset.v; c.goal = ROLES[c.role].goal; renderSheet(); },
  'svc-aux': el => { sheetCtx.goal = +el.dataset.v; renderSheet(); },
  'svc-goal': el => { const c = sheetCtx; c.goal = el.dataset.set != null ? +el.dataset.set : clamp(c.goal + +el.dataset.d, 0, 300); renderSheet(); },
  'svc-scope': el => { sheetCtx.only = el.dataset.v === 'only'; renderSheet(); },
  'svc-save': () => { const c = sheetCtx, snap = snapshot(); setPlan(c.ym, c.role, c.goal, c.only); save(); closeSheet(); setTimeout(() => toast(`Pronto: ${roleLabel(c.role)}, meta de ${c.goal}h.`, { label: 'Desfazer', fn: () => restoreSnap(snap) }), 80); },
  'ob-g': el => { OB.g = el.dataset.g; OB.err = ''; render(); },
  'ob-next': () => {
    if (OB.step === 1 && !OB.name.trim()) { OB.err = 'Escreva o seu nome para continuar.'; render(); const i = $('#ob-name'); if (i) i.focus(); return; }
    if (OB.step === 1 && !OB.g) { OB.err = 'Toque em Irmão ou Irmã.'; render(); return; }
    if (OB.step === 2 && !OB.role) { OB.err = 'Escolha uma opção para continuar.'; render(); return; }
    OB.err = ''; OB.step++; render(); window.scrollTo(0, 0);
  },
  'ob-back': () => { OB.err = ''; OB.step = Math.max(1, OB.step - 1); render(); },
  'ob-role': el => { OB.role = el.dataset.v; OB.goal = ROLES[OB.role].goal; OB.err = ''; render(); },
  'ob-aux': el => { OB.goal = +el.dataset.v; render(); },
  'ob-goal': el => { OB.goal = el.dataset.set != null ? +el.dataset.set : clamp(OB.goal + +el.dataset.d, 0, 300); render(); },
  'ob-finish': () => { S.profile = { name: OB.name.trim(), g: OB.g, createdAt: Date.now() }; S.plan = [{ from: '0000-01', role: OB.role, goal: OB.goal }]; save(); route = 'inicio'; hist('replaceState', { r: 'inicio' }, 'inicio'); render(); window.scrollTo(0, 0); toast(`Tudo pronto, ${firstName(S.profile.name)}!`); },
  demo: () => { demo = true; S = buildDemo(); route = 'inicio'; hist('replaceState', { r: 'inicio' }, 'inicio'); render(); window.scrollTo(0, 0); toast('Este é um exemplo. Nada aqui fica salvo.'); },
  'demo-exit': () => { demo = false; load(); Object.assign(OB, { step: 1, err: '' }); sheet = null; renderSheet(); route = 'inicio'; hist('replaceState', { r: 'inicio' }, 'inicio'); render(); window.scrollTo(0, 0); },
  dlg: el => { const a = dlgActions[+el.dataset.i]; if (!a) return; if (!a.keep) closeDialog(); if (a.fn) a.fn(); },
  'toast-act': () => { const f = toastAction; $('#toast-root').innerHTML = ''; toastAction = null; if (f) f(); }
};
function parseNum(v, max) { const n = parseInt(String(v).replace(/\D/g, ''), 10); return Number.isFinite(n) ? clamp(n, 0, max) : 0; }
function setPressed(sel, fn) { document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(!!fn(b)))); }
function syncGoalUI(act, auxAct, goal) {
  setPressed(`[data-act="${act}"][data-set]`, b => +b.dataset.set === goal);
  setPressed(`[data-act="${auxAct}"]`, b => +b.dataset.v === goal);
}
function syncTimeUI() { const tot = sheetCtx.h * 60 + sheetCtx.m; setPressed('.qchip[data-act="quick"]', b => +b.dataset.min === tot); }
function markSent(ym) {
  monthMeta(ym).sentAt = Date.now(); save();
  if (route === 'relatorio') render();
  toast('Relatório marcado como enviado.', { label: 'Desmarcar', fn: () => { delete monthMeta(ym).sentAt; save(); render(); } });
}
const IN = {
  h: el => { sheetCtx.h = parseNum(el.value, 23); sheetCtx.err = ''; syncTimeUI(); },
  m: el => { sheetCtx.m = parseNum(el.value, 59); sheetCtx.err = ''; syncTimeUI(); },
  'ob-goal': el => { OB.goal = parseNum(el.value, 300); syncGoalUI('ob-goal', 'ob-aux', OB.goal); },
  'svc-goal': el => { sheetCtx.goal = parseNum(el.value, 300); syncGoalUI('svc-goal', 'svc-aux', sheetCtx.goal); },
  date: el => { if (el.value) { sheetCtx.date = el.value > todayStr() ? todayStr() : el.value; sheetCtx.showOther = true; renderSheet(); } },
  note: el => { sheetCtx.note = el.value; },
  'student-name': el => { sheetCtx.newName = el.value; },
  'r-comments': el => { monthMeta(R.ym).comments = el.value; saveSoon(); updateReportPreview(); },
  wa: el => { S.settings.wa = el.value; saveSoon(); updateReportPreview(); },
  'set-name': el => { const v = el.value.trim(); if (v) { S.profile.name = v; saveSoon(); } },
  'ob-name': el => { OB.name = el.value; }
};
const CH = {
  h: el => { el.value = String(sheetCtx.h); syncTimeUI(); },
  m: el => { el.value = pad(sheetCtx.m); syncTimeUI(); },
  'ob-goal': el => { el.value = String(OB.goal); },
  'svc-goal': el => { el.value = String(sheetCtx.goal); },
  'set-name': () => { save(); toast('Nome salvo.'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'dlg-backdrop') { if (e.target === el) closeDialog(); return; }
  const fn = A[act];
  if (!fn) return;
  if (el.tagName === 'A' && act !== 'r-wa') e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el); });
document.addEventListener('change', e => { const el = e.target.closest('[data-in]'); if (el && CH[el.dataset.in]) CH[el.dataset.in](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#dlg-root').innerHTML) closeDialog(); else if (sheet) closeSheet(); return; }
  if (e.key === 'Enter' && e.target.id === 'ob-name') { e.preventDefault(); A['ob-next'](); return; }
  if (e.key === 'Enter' && e.target.id === 'f-student') { e.preventDefault(); A['student-add'](); return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.goal-input, #f-h, #f-m')) { e.preventDefault(); e.target.blur(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.dataset && e.target.dataset.act && A[e.target.dataset.act]) { e.preventDefault(); A[e.target.dataset.act](e.target, e); }
});
function selectAll(e) {
  const t = e.target;
  if (!t || !t.matches || !t.matches('.goal-input, #f-h, #f-m')) return;
  try { t.select(); } catch (err) { /* nada */ }
  setTimeout(() => { try { t.select(); } catch (err) { /* nada */ } }, 0);
}
document.addEventListener('focusin', selectAll);
document.addEventListener('pointerup', selectAll);
$('#file-restore').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { importText(await f.text()); } catch (err) { dialog({ title: 'Não deu certo', html: '<p>Não consegui ler esse arquivo.</p>', actions: [{ label: 'Entendi', kind: 'btn-primary' }] }); }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (!sheet && (route === 'inicio' || route === 'ajustes')) render(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('App instalado! Procure o ícone "Pregação" na tela do celular.'); if (!sheet) render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheet && route === 'inicio' && S.profile) render(); ensureTick(); });
window.addEventListener('resize', debounce(() => { if (route === 'historico' && !sheet && S.profile) render(); }, 200));
if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyLook); }

/* ================= Início ================= */
load();
initRoute();
if (!inFrame && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* sem modo offline */ });
}
})();
</script>
</body>
</html>
